<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    Link preview card (WhatsApp, iMessage, Slack...): a bar of dark chocolate half out of its kraft wrapper.
    Flat vector: solid fills only. Rendered to public/og.jpg by `npm run og`; the fonts come from Google Fonts at render time only.
  -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&amp;family=Caveat:wght@500&amp;display=swap');
    .name { font: 600 66px 'Playfair Display', Georgia, serif; fill: #2B1B12; }
    .tagline { font: 500 31px 'Caveat', cursive; fill: #6F4428; }
  </style>
  <defs>
    <!-- The wrapper, torn along its left edge; used for the paper and again for the shadow it casts. -->
    <path id="wrap" d="M600 108H1092a20 20 0 0 1 20 20V502a20 20 0 0 1-20 20H600L576 486 604 450 576 414 604 378 576 342 604 306 576 270 604 234 576 198 604 162 576 126Z"/>
    <!-- One square of the bar: two flat tones. -->
    <g id="seg">
      <rect width="100" height="100" rx="14" fill="#4A2C1D"/>
      <rect x="16" y="16" width="68" height="68" rx="8" fill="#5C3824"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="#1C110B"/>

  <g transform="rotate(-6 600 315)">
    <!-- the tablet: its side, then its face -->
    <rect x="120" y="151" width="960" height="360" rx="22" fill="#24150B"/>
    <rect x="120" y="135" width="960" height="360" rx="22" fill="#3A2418"/>
    <use href="#seg" x="130" y="145"/><use href="#seg" x="250" y="145"/><use href="#seg" x="370" y="145"/><use href="#seg" x="490" y="145"/>
    <use href="#seg" x="610" y="145"/><use href="#seg" x="730" y="145"/><use href="#seg" x="850" y="145"/><use href="#seg" x="970" y="145"/>
    <use href="#seg" x="130" y="265"/><use href="#seg" x="250" y="265"/><use href="#seg" x="370" y="265"/><use href="#seg" x="490" y="265"/>
    <use href="#seg" x="610" y="265"/><use href="#seg" x="730" y="265"/><use href="#seg" x="850" y="265"/><use href="#seg" x="970" y="265"/>
    <use href="#seg" x="130" y="385"/><use href="#seg" x="250" y="385"/><use href="#seg" x="370" y="385"/><use href="#seg" x="490" y="385"/>
    <use href="#seg" x="610" y="385"/><use href="#seg" x="730" y="385"/><use href="#seg" x="850" y="385"/><use href="#seg" x="970" y="385"/>

    <!-- foil -->
    <path fill="#D5CFC3" d="M520 122H1100V508H520L508 472 530 432 508 392 530 352 508 312 530 272 508 232 530 192 508 152Z"/>

    <!-- kraft wrapper: the shadow it casts, then the paper -->
    <use href="#wrap" fill="#000" fill-opacity=".35" transform="translate(-12 6)"/>
    <use href="#wrap" fill="#DCC5A4"/>

    <!-- printed label -->
    <text class="name" x="856" y="278" text-anchor="middle">Chocolates</text>
    <text class="name" x="856" y="346" text-anchor="middle">para Andrea</text>
    <text class="tagline" x="856" y="408" text-anchor="middle">Delicias diseñadas</text>
    <text class="tagline" x="856" y="444" text-anchor="middle">con mi princesa en mente…</text>
  </g>
</svg>
